<style>

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--ramka); vertical-align:top; }
  th { background:var(--tlo2); font-weight:600; }
  td.kwota, td.nr, td.data { white-space:nowrap; }
  .menu { display:flex; gap:8px; flex-wrap:wrap; }
  .menu button, .szczegoly button { font:inherit; font-size:16px; padding:6px 12px; border:1px solid var(--akcent); background:#fff;
                                    color:var(--akcent); border-radius:5px; cursor:pointer; }
  .menu button:hover, .szczegoly button:hover { background:var(--akcent); color:#fff; }
  .menu button[aria-expanded="true"] { background:var(--tlo2); }
  .szczegoly { margin-top:10px; padding:10px 12px; background:var(--tlo2); border-left:4px solid var(--akcent); }
  .szczegoly p { margin:0 0 8px; }
  #status { margin-top:18px; min-height:1.5em; font-weight:600; color:#1b6b3a; }
  .stopka { margin-top:28px; font-size:13px; color:#6b7785; }
</style>
</head>

/* PDF-DANE-KONIEC */
(function () {
  'use strict';
  var FAKTURY = [
    { nr: 'FV-216', dostawca: 'Alfa Materiały Sp. z o.o.',      data: '2026-10-05', kwota: '4 210,00 PLN' },
    { nr: 'FV-217', dostawca: 'Beta Logistyka S.A.',            data: '2026-10-12', kwota: '12 950,00 PLN' },
    { nr: 'FV-218', dostawca: 'Gamma Opakowania Sp. z o.o.',    data: '2026-10-19', kwota: '6 480,00 PLN' },
    { nr: 'FV-219', dostawca: 'Delta Serwis Sp. z o.o.',        data: '2026-10-26', kwota: '1 830,00 PLN' }
  ];
  var WIDOKI = {
    A: { opis: 'pobieranie bezpośrednio w wierszu',
         akcje: [ { id: 'pobierz-pdf', etykieta: 'Pobierz PDF' } ] },
    B: { opis: 'pobieranie ukryte pod przyciskiem Dokumenty',
         akcje: [ { id: 'dane-firmy', etykieta: 'Dane firmy' }, { id: 'dokumenty', etykieta: 'Dokumenty' },
                  { id: 'historia-platnosci', etykieta: 'Historia płatności' } ] },
    C: { opis: 'jak widok B, ale przycisk Dokumenty zmienił nazwę',
         akcje: [ { id: 'dane-firmy', etykieta: 'Dane firmy' }, { id: 'dokumenty', etykieta: 'Faktury i rozliczenia' },
                  { id: 'historia-platnosci', etykieta: 'Historia płatności' } ] },
    D: { opis: 'jak widok B, ale etykiety są mniej jednoznaczne',
         akcje: [ { id: 'dane-firmy', etykieta: 'Dane firmy' }, { id: 'dokumenty', etykieta: 'Rozliczenia' },
                  { id: 'historia-platnosci', etykieta: 'Płatności' } ] }
  };

  var param = (new URLSearchParams(location.search).get('widok') || 'A').toUpperCase();
  var widok = WIDOKI[param] ? param : 'A';
  var def = WIDOKI[widok];

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  function godzina() { return new Date().toTimeString().slice(0, 8); }

  /* ?uczen=1: wersja dla studentów i agenta (ScreenPlay): bez panelu prowadzącego i bez opisu układu, który zdradzałby rozwiązanie */
  var uczen = new URLSearchParams(location.search).get('uczen') === '1';
  if (uczen) {
    document.getElementById('panel-prowadzacego').hidden = true;
  } else {
    document.getElementById('widok-opis').textContent = 'Widok ' + widok + ': ' + def.opis + '. Dane fikcyjne, strona do zajęć.';
  }

  var przel = document.getElementById('przelaczniki');
  Object.keys(WIDOKI).forEach(function (k) {
    var a = el('a', { href: '?widok=' + k }, k);
    if (k === widok) { a.setAttribute('aria-current', 'true'); }
    przel.appendChild(a);
    przel.appendChild(document.createTextNode(' '));
  });
  document.getElementById('reset').addEventListener('click', function () { location.reload(); });

  function pobierz(nr) {
    var bin = atob(PDF[nr]), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    var adres = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a');
    a.href = adres;
    a.download = nr + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(adres); }, 5000);
    var s = document.getElementById('status');
    var n = (parseInt(s.getAttribute('data-liczba-pobran'), 10) || 0) + 1;
    s.setAttribute('data-liczba-pobran', String(n));
    s.setAttribute('data-ostatnie-pobranie', nr + '.pdf');
    s.textContent = 'Pobrano plik ' + nr + '.pdf (' + godzina() + ')';
  }

  function przyciskPobierz(f) {
    var b = el('button', { type: 'button', 'data-akcja': 'pobierz-pdf', 'data-faktura': f.nr }, 'Pobierz PDF');
    b.addEventListener('click', function () { pobierz(f.nr); });
    return b;
  }

  function wypelnij(panel, id, f) {
    panel.textContent = '';
    if (id === 'dokumenty') {
      panel.appendChild(przyciskPobierz(f));
    } else if (id === 'dane-firmy') {
      panel.appendChild(el('p', {}, 'Dostawca: ' + f.dostawca + '. Dane adresowe i NIP (fikcyjne): 000-000-00-00.'));
    } else {
      panel.appendChild(el('p', {}, 'Historia płatności faktury ' + f.nr + ': brak zaksięgowanych wpłat.'));
    }
  }

  var tbody = document.querySelector('#faktury tbody');
  FAKTURY.forEach(function (f) {
    var tr = el('tr', { 'data-faktura': f.nr });
    tr.appendChild(el('td', { class: 'nr' }, f.nr));
    tr.appendChild(el('td', {}, f.dostawca));
    tr.appendChild(el('td', { class: 'data' }, f.data));
    tr.appendChild(el('td', { class: 'kwota' }, f.kwota));
    var td = el('td', { class: 'akcje' });
    var grupa = el('div', { class: 'grupa-akcji', role: 'group', 'aria-label': 'Akcje faktury ' + f.nr });
    var menu = el('div', { class: 'menu' });
    var panel = el('div', { class: 'szczegoly' });      /* w grupie: tylko przycisk Pobierz PDF */
    panel.hidden = true;
    var info = el('div', { class: 'szczegoly' });       /* poza grupą: akapity informacyjne (bez przycisków) */
    info.hidden = true;
    def.akcje.forEach(function (a) {
      if (a.id === 'pobierz-pdf') {
        var bp = przyciskPobierz(f);
        bp.textContent = a.etykieta;
        menu.appendChild(bp);
        return;
      }
      var b = el('button', { type: 'button', 'data-akcja': a.id, 'data-faktura': f.nr, 'aria-expanded': 'false' }, a.etykieta);
      b.addEventListener('click', function () {
        var byl = b.getAttribute('aria-expanded') === 'true';
        [].forEach.call(menu.querySelectorAll('button[aria-expanded]'), function (x) { x.setAttribute('aria-expanded', 'false'); });
        panel.hidden = true;
        panel.textContent = '';
        info.hidden = true;
        info.textContent = '';
        if (byl) { return; }
        b.setAttribute('aria-expanded', 'true');
        var cel = (a.id === 'dokumenty') ? panel : info;
        wypelnij(cel, a.id, f);
        cel.hidden = false;
      });
      menu.appendChild(b);
    });
    grupa.appendChild(menu);
    grupa.appendChild(panel);
    td.appendChild(grupa);
    td.appendChild(info);
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
})();
